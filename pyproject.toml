[project]
name = "knowledge-vault-mcp"
version = "0.1.0"
description = "Self-hosted MCP server for hybrid retrieval over a git-backed Obsidian vault"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic-settings>=2.6",
    "uvicorn>=0.30",
    "fastembed>=0.7",
    "sqlite-vec>=0.1.6",
]

[project.scripts]
kvault = "knowledge_vault_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_vault_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:knowledge_vault_mcp.*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607"]
"src/knowledge_vault_mcp/vault.py" = ["S603", "S607"]  # fixed git invocations, no shell
"src/knowledge_vault_mcp/auth/login.py" = ["E501"]  # inline HTML template
